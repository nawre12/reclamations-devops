name: 'Rollback - environnement de test'

# Procédure de retour arrière exécutable depuis l'interface GitHub Actions.
on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Image de la version stable (ex : ghcr.io/proprietaire/depot:sha-abc123)'
        required: true
        type: string
      version:
        description: 'Version cible affichée par /health (ex : sha-abc123)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  rollback:
    name: 'Retour à une version stable + smoke tests'
    runs-on: ubuntu-latest
    environment:
      name: test
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ inputs.image }}
      APP_VERSION: ${{ inputs.version }}
      SMOKE_BASE_URL: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Connexion au registre GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Déploiement de la version stable
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET_TEST || github.run_id }}
        run: node scripts/rollback.js --image="$IMAGE" --version="$APP_VERSION"
      - name: Journaux après rollback (preuve)
        if: always()
        run: docker compose -p reclamations-test -f docker-compose.test.yml logs --tail=200 > rollback-logs.txt || true
      - name: Trace du rollback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preuves-rollback-${{ github.run_id }}
          path: |
            rollback-logs.txt
            state/deployment.json
            state/deployment-history.json
            state/smoke-result.json
          if-no-files-found: ignore
          retention-days: 14
