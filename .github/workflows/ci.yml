name: 'CI/CD - gestion des réclamations'

# Déclencheurs : chaque push et chaque Pull Request, plus un lancement manuel.
on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      deploy_test:
        description: 'Déployer en environnement de test après la construction'
        type: boolean
        required: false
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  quality:
    name: '1. Qualité (format + lint)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Installation reproductible
        run: npm ci
      - name: Vérification du formatage
        run: npm run format:check
      - name: Analyse statique (ESLint)
        run: npm run lint

  unit-tests:
    name: '2. Tests unitaires'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  integration-tests:
    name: '3. Tests API + couverture'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reclamations_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reclamations_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/reclamations_test
      JWT_SECRET: ${{ github.run_id }}
      APP_VERSION: ci-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Tests d'intégration et seuil de couverture
        run: npm run test:integration:coverage
      - name: Rapport de couverture (preuve)
        uses: actions/upload-artifact@v4
        with:
          name: couverture-${{ github.sha }}
          path: coverage
          retention-days: 14

  security:
    name: '4. Sécurité (audit + secrets)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Audit des dépendances
        run: npm run security:audit
      - name: Détection de secrets versionnés
        run: npm run security:secrets

  build-artifact:
    name: '5. Artefact versionné'
    needs: [quality, unit-tests, integration-tests, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Dépendances de production uniquement
        run: npm ci --omit=dev
      - name: Construction de l'artefact
        run: |
          VERSION="${{ github.sha }}"
          mkdir -p artifacts
          tar -czf "artifacts/reclamations-${VERSION}.tar.gz" \
            package.json package-lock.json src public node_modules
          printf '%s\n' "$VERSION" > artifacts/VERSION.txt
          printf ' artefact : reclamations-%s.tar.gz\n' "$VERSION"
      - name: Artefact récupérable
        uses: actions/upload-artifact@v4
        with:
          name: artefact-${{ github.sha }}
          path: artifacts
          retention-days: 14

  image:
    name: '6. Image Docker + scan Trivy'
    needs: [build-artifact]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construction de l'image (chargée localement pour le scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: reclamations:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan de sécurité de l'image
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: reclamations:ci-${{ github.sha }}
          format: table
          output: trivy-report.txt
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
      - name: Rapport Trivy (même en cas d'échec)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ github.sha }}
          path: trivy-report.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Connexion au registre GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publication des tags versionnés
        if: github.event_name != 'pull_request'
        run: |
          SHA_TAG="${IMAGE_NAME}:sha-${{ github.sha }}"
          SAFE_BRANCH=$(printf '%s' '${{ github.ref_name }}' | tr '/ ' '--')
          docker tag "reclamations:ci-${{ github.sha }}" "$SHA_TAG"
          docker tag "reclamations:ci-${{ github.sha }}" "${IMAGE_NAME}:${SAFE_BRANCH}"
          docker push "$SHA_TAG"
          docker push "${IMAGE_NAME}:${SAFE_BRANCH}"
          printf '%s\n' "$SHA_TAG" > image-version.txt
      - name: Référence de l'image publiée
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ github.sha }}
          path: image-version.txt
          retention-days: 14

  deploy-test:
    name: '7. Déploiement test + smoke tests'
    needs: [image]
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')) ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_test)
    runs-on: ubuntu-latest
    environment:
      name: test
      url: http://localhost:3001
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
      APP_VERSION: ci-${{ github.sha }}
      SMOKE_BASE_URL: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Connexion au registre GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Environnement de test propre
        run: docker compose -p reclamations-test -f docker-compose.test.yml down -v --remove-orphans || true
      - name: Déploiement puis smoke tests
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET_TEST || github.run_id }}
        run: node scripts/deploy.js
      - name: Journaux applicatifs (preuve)
        if: always()
        run: docker compose -p reclamations-test -f docker-compose.test.yml logs --tail=200 > deployment-logs.txt || true
      - name: Preuves de déploiement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preuves-deploiement-${{ github.sha }}
          path: |
            deployment-logs.txt
            state/deployment.json
            state/deployment-history.json
            state/smoke-result.json
          if-no-files-found: ignore
          retention-days: 14
