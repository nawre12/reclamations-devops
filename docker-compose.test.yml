# Environnement de test distinct : image versionnée + base PostgreSQL éphémère.
# IMAGE est fournie par le pipeline (GHCR) ou par l'utilisateur en local.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: reclamations_test
    networks:
      - reclamations-test-net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d reclamations_test']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ${IMAGE:-reclamations:test}
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/reclamations_test
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis pour l environnement de test}
      APP_VERSION: ${APP_VERSION:-test}
    ports:
      - '3001:3000'
    networks:
      - reclamations-test-net
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

networks:
  reclamations-test-net:
